<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full bg-slate-950 selection:bg-sky-500 selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المدرسين والمجموعات - نظام إدارة السناتر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Cairo', 'Inter', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .bg-grid-pattern {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased flex flex-col bg-grid-pattern">

    <!-- Header -->
    <header class="bg-slate-900/90 border-b border-slate-800/80 backdrop-blur-md sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3 space-x-reverse">
                <a href="/index.html" class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 via-indigo-600 to-sky-600 p-0.5 shadow-lg shadow-purple-500/20 flex items-center justify-center">
                    <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center text-purple-400 font-black text-lg">
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </a>
                <div>
                    <h1 class="font-bold text-lg text-white leading-tight">إدارة المدرسين والمجموعات</h1>
                    <p class="text-xs text-slate-400">سنتر النخبة التعليمي - الفرع الرئيسي</p>
                </div>
            </div>

            <div class="flex items-center gap-2.5">
                <a href="/students.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sky-400 rounded-xl text-xs font-bold transition-all">
                    <i class="fa-solid fa-users ml-1"></i> إدارة الطلاب
                </a>
                <a href="/index.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-xl text-xs font-bold transition-all">
                    <i class="fa-solid fa-gauge-high ml-1"></i> العودة للرئيسية
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-xl flex items-center justify-between flex-wrap gap-3">
            <h3 class="text-sm font-bold text-white pr-3">قائمة المدرسين والمجموعات الدراسية</h3>
            <div class="flex gap-2">
                <button onclick="openAddGroupModal()" class="px-3.5 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-xl text-xs font-bold shadow-md">
                    <i class="fa-solid fa-plus ml-1"></i> إضافة مجموعة جديدة
                </button>
                <button onclick="openAddTeacherModal()" class="px-3.5 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-bold shadow-md">
                    <i class="fa-solid fa-user-plus ml-1"></i> إضافة مدرس جديد
                </button>
            </div>
        </section>

        <!-- Grid Cards -->
        <div id="teachersCardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Dynamically populated via API -->
        </div>

    </main>

    <!-- Modal: إضافة مدرس جديد -->
    <div id="addTeacherModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-sm font-bold text-white">إضافة مدرس جديد</h3>
                <button onclick="closeAddTeacherModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="addTeacherForm" onsubmit="handleCreateTeacher(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">اسم المدرس *</label>
                    <input type="text" id="teacherNameInput" required placeholder="أ. ياسين عادل" class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2 text-xs outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">المادة الدراسية *</label>
                        <input type="text" id="teacherSubjectInput" required placeholder="الدراسات" class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2 text-xs outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">رقم الهاتف *</label>
                        <input type="text" id="teacherPhoneInput" required placeholder="01000025XXX" class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2 text-xs font-mono outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">المرحلة التعليمية *</label>
                    <select id="teacherStageSelect" onchange="handleStageChange()" class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2 text-xs outline-none">
                        <option value="">-- اختر المرحلة --</option>
                        <option value="PRIMARY">الابتدائية</option>
                        <option value="PREP">الإعدادية</option>
                        <option value="SECONDARY">الثانوية</option>
                    </select>
                </div>

                <div id="gradesContainer" class="hidden">
                    <label class="block text-xs font-bold text-slate-300 mb-1.5">الصفوف التي يدرس لها *</label>
                    <div id="gradesCheckboxes" class="grid grid-cols-2 gap-2 bg-slate-950 border border-slate-800 p-3 rounded-xl text-xs">
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
                    <button type="button" onclick="closeAddTeacherModal()" class="px-4 py-2 bg-slate-800 text-slate-300 text-xs rounded-xl font-bold">إلغاء</button>
                    <button type="submit" class="px-5 py-2 bg-purple-600 hover:bg-purple-500 text-white text-xs rounded-xl font-bold shadow-lg shadow-purple-600/20">حفظ بالداتابيز</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: إضافة مجموعة جديدة -->
    <div id="addGroupModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-sm font-bold text-white">إضافة مجموعة جديدة</h3>
                <button onclick="closeAddGroupModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="addGroupForm" onsubmit="handleCreateGroup(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">المدرس *</label>
                    <select id="groupTeacherSelect" required class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2 text-xs outline-none">
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">اسم المجموعة *</label>
                    <input type="text" id="groupNameInput" required placeholder="مجموعة السبت والأربعاء - 4 عصراً" class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2 text-xs outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">أيام الحضور *</label>
                    <div class="grid grid-cols-3 gap-2 text-xs bg-slate-950 border border-slate-800 p-2.5 rounded-xl">
                        <label class="flex items-center gap-1.5"><input type="checkbox" name="days" value="السبت"> السبت</label>
                        <label class="flex items-center gap-1.5"><input type="checkbox" name="days" value="الأحد"> الأحد</label>
                        <label class="flex items-center gap-1.5"><input type="checkbox" name="days" value="الإثنين"> الإثنين</label>
                        <label class="flex items-center gap-1.5"><input type="checkbox" name="days" value="الثلاثاء"> الثلاثاء</label>
                        <label class="flex items-center gap-1.5"><input type="checkbox" name="days" value="الأربعاء"> الأربعاء</label>
                        <label class="flex items-center gap-1.5"><input type="checkbox" name="days" value="الخميس"> الخميس</label>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">سعر الحصة / الشهر (ج.م)</label>
                        <input type="number" id="groupPriceInput" placeholder="150" class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2 text-xs font-mono outline-none">
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
                    <button type="button" onclick="closeAddGroupModal()" class="px-4 py-2 bg-slate-800 text-slate-300 text-xs rounded-xl font-bold">إلغاء</button>
                    <button type="submit" class="px-5 py-2 bg-sky-600 hover:bg-sky-500 text-white text-xs rounded-xl font-bold shadow-lg shadow-sky-600/20">حفظ المجموعة</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed bottom-5 left-5 z-50 bg-slate-800 border border-slate-700 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-2xl transition-all duration-300 transform translate-y-20 opacity-0">
        <span id="toastMessage">إشعار النظام</span>
    </div>

    <script>
        const centerId = localStorage.getItem('centerId') || 'center-101';
        let masterTeachers = [];
        let masterGroups = [];

        const stageGrades = {
            'PRIMARY': ['الصف الرابع', 'الصف الخامس', 'الصف السادس'],
            'PREP': ['الصف الأول الإعدادي', 'الصف الثاني الإعدادي', 'الصف الثالث الإعدادي'],
            'SECONDARY': ['الصف الأول الثانوي', 'الصف الثاني الثانوي', 'الصف الثالث الثانوي']
        };

        window.onload = function() {
            fetchTeachersFromApi();
            fetchGroupsFromApi();
        };

        async function fetchTeachersFromApi() {
            try {
                const response = await fetch('/api/teachers', {
                    headers: { 'x-center-id': centerId }
                });
                const resData = await response.json();
                if (resData.success && Array.isArray(resData.data)) {
                    masterTeachers = resData.data;
                    renderTeachersCards();
                    populateGroupTeacherDropdown();
                }
            } catch (e) {
                console.error("Error fetching teachers:", e);
            }
        }

        async function fetchGroupsFromApi() {
            try {
                const response = await fetch('/api/groups/today', {
                    headers: { 'x-center-id': centerId }
                });
                const resData = await response.json();
                if (resData.success && Array.isArray(resData.data)) {
                    masterGroups = resData.data;
                    renderTeachersCards();
                }
            } catch (e) {
                console.error("Error fetching groups:", e);
            }
        }

        function handleStageChange() {
            const stage = document.getElementById('teacherStageSelect').value;
            const container = document.getElementById('gradesContainer');
            const checkboxesDiv = document.getElementById('gradesCheckboxes');

            if (!stage || !stageGrades[stage]) {
                container.classList.add('hidden');
                return;
            }

            checkboxesDiv.innerHTML = stageGrades[stage].map(grade => `
                <label class="flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" name="teacherGrades" value="${grade}" class="rounded accent-purple-500">
                    <span>${grade}</span>
                </label>
            `).join('');

            container.classList.remove('hidden');
        }

        function renderTeachersCards() {
            const grid = document.getElementById('teachersCardsGrid');
            grid.innerHTML = '';

            if (masterTeachers.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center py-8 text-slate-500 text-xs">لا يوجد مدرسون مسجلون بقاعدة البيانات.</div>`;
                return;
            }

            masterTeachers.forEach(teacher => {
                const teacherGroups = masterGroups.filter(g => g.teacher_id === teacher.id);
                const gradesList = Array.isArray(teacher.grades) ? teacher.grades.join(' - ') : (teacher.grades || 'جميع الصفوف');

                const cardHtml = `
                    <div class="teacher-card bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
                        <div>
                            <div class="flex items-start justify-between mb-3">
                                <div>
                                    <h3 class="text-base font-bold text-white">${teacher.name}</h3>
                                    <span class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-purple-500/10 text-purple-300 border border-purple-500/20 mt-1">
                                        مادة ${teacher.subject}
                                    </span>
                                </div>
                                <div class="w-10 h-10 rounded-xl bg-purple-600/20 border border-purple-500/30 text-purple-400 flex items-center justify-center font-bold text-lg">
                                    <i class="fa-solid fa-chalkboard-user"></i>
                                </div>
                            </div>

                            <div class="space-y-1.5 text-xs text-slate-300 border-t border-b border-slate-800/80 py-3 my-3">
                                <div class="flex justify-between">
                                    <span class="text-slate-400">الهاتف:</span>
                                    <span class="font-mono text-slate-200">${teacher.phone}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">الصفوف:</span>
                                    <span class="text-purple-300 font-bold truncate max-w-[150px]">${gradesList}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">المجموعات:</span>
                                    <span class="font-bold text-sky-400">${teacherGroups.length} مجموعات</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center justify-between pt-1">
                            <span class="text-[11px] text-slate-500"><i class="fa-solid fa-circle text-[8px] text-emerald-500 ml-1"></i>نشط</span>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        function populateGroupTeacherDropdown() {
            const select = document.getElementById('groupTeacherSelect');
            if (masterTeachers.length === 0) {
                select.innerHTML = '<option value="">لا يوجد مدرسين - أضف مدرس أولاً</option>';
                return;
            }
            select.innerHTML = masterTeachers.map(t => `<option value="${t.id}">${t.name} (${t.subject})</option>`).join('');
        }

        function openAddTeacherModal() { document.getElementById('addTeacherModal').classList.remove('hidden'); }
        function closeAddTeacherModal() { 
            document.getElementById('addTeacherModal').classList.add('hidden'); 
            document.getElementById('addTeacherForm').reset();
            document.getElementById('gradesContainer').classList.add('hidden');
        }

        function openAddGroupModal() { document.getElementById('addGroupModal').classList.remove('hidden'); }
        function closeAddGroupModal() { 
            document.getElementById('addGroupModal').classList.add('hidden'); 
            document.getElementById('addGroupForm').reset();
        }

        async function handleCreateTeacher(e) {
            e.preventDefault();
            const name = document.getElementById('teacherNameInput').value.trim();
            const subject = document.getElementById('teacherSubjectInput').value.trim();
            const phone = document.getElementById('teacherPhoneInput').value.trim();
            const stage = document.getElementById('teacherStageSelect').value;

            const selectedGrades = Array.from(document.querySelectorAll('input[name="teacherGrades"]:checked')).map(cb => cb.value);

            try {
                const response = await fetch('/api/teachers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-center-id': centerId },
                    body: JSON.stringify({
                        name,
                        subject,
                        phone,
                        stage,
                        grades: selectedGrades,
                        commission_type: 'PERCENTAGE',
                        commission_value: 0
                    })
                });

                const resData = await response.json();
                if (response.ok || resData.success) {
                    closeAddTeacherModal();
                    showToast(`تم حفظ المدرس ${name} بنجاح`);
                    fetchTeachersFromApi();
                } else {
                    showToast(resData.message || 'حدث خطأ أثناء الحفظ');
                }
            } catch (err) {
                closeAddTeacherModal();
                showToast('حدث خطأ في الاتصال بالسيرفر');
            }
        }

        async function handleCreateGroup(e) {
            e.preventDefault();
            const teacherId = document.getElementById('groupTeacherSelect').value;
            const name = document.getElementById('groupNameInput').value.trim();
            const price = parseFloat(document.getElementById('groupPriceInput').value) || 0;
            const selectedDays = Array.from(document.querySelectorAll('input[name="days"]:checked')).map(cb => cb.value);

            try {
                const response = await fetch('/api/groups', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-center-id': centerId },
                    body: JSON.stringify({
                        teacher_id: teacherId,
                        name,
                        price,
                        days: selectedDays
                    })
                });

                closeAddGroupModal();
                showToast(`تم حفظ مجموعة (${name}) بنجاح`);
                fetchGroupsFromApi();
            } catch (err) {
                closeAddGroupModal();
                showToast('حدث خطأ أثناء حفظ المجموعة');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
