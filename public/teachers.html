<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full bg-slate-950 selection:bg-sky-500 selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المدرسين والمجموعات والتسويات المالية - نظام إدارة السناتر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Cairo', 'Inter', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .bg-grid-pattern {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased flex flex-col bg-grid-pattern">

    <header class="bg-slate-900/90 border-b border-slate-800/80 backdrop-blur-md sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3 space-x-reverse">
                <a href="/index.html" class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 via-indigo-600 to-sky-600 p-0.5 shadow-lg shadow-purple-500/20 flex items-center justify-center">
                    <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center text-purple-400 font-black text-lg">
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </a>
                <div>
                    <h1 class="font-bold text-lg text-white leading-tight">إدارة المدرسين والتسويات المالية</h1>
                    <p class="text-xs text-slate-400">سنتر النخبة التعليمي - الفرع الرئيسي</p>
                </div>
            </div>

            <div class="flex items-center gap-2.5">
                <a href="/students.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sky-400 rounded-xl text-xs font-bold transition-all">
                    <i class="fa-solid fa-users ml-1"></i> إدارة الطلاب
                </a>
                <a href="/index.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-xl text-xs font-bold transition-all">
                    <i class="fa-solid fa-gauge-high ml-1"></i> العودة للرئيسية
                </a>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-2 shadow-xl flex items-center justify-between flex-wrap gap-2">
            <h3 class="text-sm font-bold text-white pr-3">قائمة المدرسين والمجموعات الدراسية</h3>
            <button onclick="openAddTeacherModal()" class="px-3.5 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-bold shadow-md">
                <i class="fa-solid fa-user-plus ml-1"></i> إضافة مدرس جديد
            </button>
        </section>

        <div id="teachersCardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Dynamically populated via API -->
        </div>

    </main>

    <div id="addTeacherModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-sm font-bold text-white">إضافة مدرس جديد</h3>
                <button onclick="closeAddTeacherModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="addTeacherForm" onsubmit="handleCreateTeacher(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">اسم المدرس *</label>
                    <input type="text" id="teacherNameInput" required placeholder="أ. محمد عبد المعبود" class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2.5 text-xs outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">المادة الدراسية *</label>
                        <input type="text" id="teacherSubjectInput" required placeholder="الفيزياء" class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2.5 text-xs outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">رقم الهاتف *</label>
                        <input type="text" id="teacherPhoneInput" required placeholder="010XXXXXXXX" class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2.5 text-xs font-mono outline-none">
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button type="button" onclick="closeAddTeacherModal()" class="px-4 py-2 bg-slate-800 text-slate-300 text-xs rounded-xl font-bold">إلغاء</button>
                    <button type="submit" class="px-5 py-2 bg-purple-600 hover:bg-purple-500 text-white text-xs rounded-xl font-bold">حفظ بالداتابيز</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastNotification" class="fixed bottom-5 left-5 z-50 bg-slate-800 border border-slate-700 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-2xl transition-all duration-300 transform translate-y-20 opacity-0">
        <span id="toastMessage">إشعار النظام</span>
    </div>

    <script>
        const centerId = localStorage.getItem('centerId') || 'center-101';
        let masterTeachers = [];
        let masterGroups = [];

        window.onload = function() {
            fetchTeachersFromApi();
            fetchGroupsFromApi();
        };

        async function fetchTeachersFromApi() {
            try {
                const response = await fetch('/api/teachers', {
                    headers: { 'x-center-id': centerId }
                });
                const resData = await response.json();
                if (resData.success && Array.isArray(resData.data)) {
                    masterTeachers = resData.data;
                    renderTeachersCards();
                    populateCalcTeacherDropdowns();
                    updateMetricsSummary();
                }
            } catch (e) {
                console.error("Error fetching teachers:", e);
            }
        }

        async function fetchGroupsFromApi() {
            try {
                const response = await fetch('/api/groups/today', {
                    headers: { 'x-center-id': centerId }
                });
                const resData = await response.json();
                if (resData.success && Array.isArray(resData.data)) {
                    masterGroups = resData.data;
                    renderGroupsTable();
                    updateMetricsSummary();
                }
            } catch (e) {
                console.error("Error fetching groups:", e);
            }
        }

        function switchTab(tab) {
            const teachersView = document.getElementById('tabTeachersView');
            const settlementsView = document.getElementById('tabSettlementsView');
            const btnTeachers = document.getElementById('tabBtnTeachers');
            const btnSettlements = document.getElementById('tabBtnSettlements');

            if (tab === 'teachers') {
                teachersView.classList.remove('hidden');
                settlementsView.classList.add('hidden');
                btnTeachers.className = 'px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-lg shadow-purple-500/20';
                btnSettlements.className = 'px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700';
            } else {
                settlementsView.classList.remove('hidden');
                teachersView.classList.add('hidden');
                btnSettlements.className = 'px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-lg shadow-purple-500/20';
                btnTeachers.className = 'px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700';
            }
        }

        function updateMetricsSummary() {
            document.getElementById('metricTotalTeachers').textContent = masterTeachers.length;
            document.getElementById('metricTotalGroups').textContent = masterGroups.length;
        }

        function renderTeachersCards(filterQuery = '') {
            const grid = document.getElementById('teachersCardsGrid');
            grid.innerHTML = '';

            const filtered = masterTeachers.filter(t => 
                !filterQuery || 
                t.name.toLowerCase().includes(filterQuery.toLowerCase()) || 
                t.subject.toLowerCase().includes(filterQuery.toLowerCase())
            );

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center py-8 text-slate-500 text-xs">لا يوجد مدرسون مسجلون بقاعدة البيانات.</div>`;
                return;
            }

            filtered.forEach(teacher => {
                const teacherGroups = masterGroups.filter(g => g.teacher_id === teacher.id);
                const commText = teacher.commission_type === 'PERCENTAGE' 
                    ? `نسبة السنتر: ${teacher.commission_value}%` 
                    : `خصم ثابت: ${teacher.commission_value} ج.م / طالب`;

                const cardHtml = `
                    <div class="teacher-card bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl relative overflow-hidden flex flex-col justify-between">
                        <div>
                            <div class="flex items-start justify-between mb-3">
                                <div>
                                    <h3 class="text-base font-bold text-white">${teacher.name}</h3>
                                    <span class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-purple-500/10 text-purple-300 border border-purple-500/20 mt-1">
                                        مادة ${teacher.subject}
                                    </span>
                                </div>
                                <div class="w-10 h-10 rounded-xl bg-purple-600/20 border border-purple-500/30 text-purple-400 flex items-center justify-center font-bold text-lg">
                                    <i class="fa-solid fa-chalkboard-user"></i>
                                </div>
                            </div>

                            <div class="space-y-1.5 text-xs text-slate-300 border-t border-b border-slate-800/80 py-3 my-3">
                                <div class="flex justify-between">
                                    <span class="text-slate-400">الهاتف:</span>
                                    <span class="font-mono text-slate-200">${teacher.phone}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">نظام العمولة:</span>
                                    <span class="font-bold text-emerald-400">${commText}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">المجموعات:</span>
                                    <span class="font-bold text-sky-400">${teacherGroups.length} مجموعات</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center justify-between pt-1">
                            <button onclick="selectTeacherForSettlement('${teacher.id}')" class="px-3.5 py-2 bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white border border-emerald-500/30 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5">
                                <i class="fa-solid fa-calculator"></i>
                                <span>تقفيل حساب</span>
                            </button>
                            <span class="text-[11px] text-slate-500"><i class="fa-solid fa-circle text-[8px] text-emerald-500 ml-1"></i>مسجل</span>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        function filterTeachersList() {
            const q = document.getElementById('searchTeacherInput').value.trim();
            renderTeachersCards(q);
        }

        function renderGroupsTable() {
            const tbody = document.getElementById('groupsTableBody');
            tbody.innerHTML = '';
            document.getElementById('groupsCountTag').textContent = `${masterGroups.length} مجموعة مسجلة`;

            if (masterGroups.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-500">لا توجد مجموعات دراسية مسجلة حالياً.</td></tr>`;
                return;
            }

            masterGroups.forEach(grp => {
                const teacher = masterTeachers.find(t => t.id === grp.teacher_id) || grp.teacher;

                const rowHtml = `
                    <tr class="hover:bg-slate-800/40 transition-colors">
                        <td class="p-3 font-bold text-white">${grp.name}</td>
                        <td class="p-3 text-purple-300 font-medium">${teacher ? teacher.name : '--'}</td>
                        <td class="p-3 text-slate-400">--</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded bg-slate-800 text-sky-400 font-mono text-[11px] border border-slate-700">مجدولة</span></td>
                        <td class="p-3 font-mono font-bold text-emerald-400">${grp.price || 0} ج.م</td>
                        <td class="p-3 font-mono text-slate-300">--</td>
                        <td class="p-3 text-center">
                            <button onclick="showToast('مجموعة ${grp.name}')" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', rowHtml);
            });
        }

        function populateCalcTeacherDropdowns() {
            const select = document.getElementById('calcTeacherSelect');
            select.innerHTML = '<option value="">-- اختر مدرس للحساب --</option>';
            masterTeachers.forEach(t => {
                select.insertAdjacentHTML('beforeend', `<option value="${t.id}">${t.name} (${t.subject})</option>`);
            });

            const grpTeacherSelect = document.getElementById('groupTeacherSelect');
            grpTeacherSelect.innerHTML = masterTeachers.map(t => `<option value="${t.id}">${t.name} - ${t.subject}</option>`).join('');
        }

        function selectTeacherForSettlement(teacherId) {
            switchTab('settlements');
            document.getElementById('calcTeacherSelect').value = teacherId;
            handleCalcTeacherChange();
        }

        function handleCalcTeacherChange() {
            const teacherId = document.getElementById('calcTeacherSelect').value;
            const groupSelect = document.getElementById('calcGroupSelect');

            if (!teacherId) {
                groupSelect.innerHTML = '<option value="ALL">جميع مجموعات المدرس الحالية</option>';
                return;
            }

            const teacherGroups = masterGroups.filter(g => g.teacher_id === teacherId);
            groupSelect.innerHTML = '<option value="ALL">جميع مجموعات المدرس الحالية</option>';
            teacherGroups.forEach(g => {
                groupSelect.insertAdjacentHTML('beforeend', `<option value="${g.id}">${g.name}</option>`);
            });
        }

        function openAddTeacherModal() {
            document.getElementById('addTeacherModal').classList.remove('hidden');
        }
        function closeAddTeacherModal() {
            document.getElementById('addTeacherModal').classList.add('hidden');
            document.getElementById('addTeacherForm').reset();
        }

        function updateCommLabel(suffix) {
            document.getElementById('commValueLabel').textContent = `قيمة الخصم (${suffix}):`;
        }

        async function handleCreateTeacher(e) {
            e.preventDefault();
            const name = document.getElementById('teacherNameInput').value.trim();
            const subject = document.getElementById('teacherSubjectInput').value.trim();
            const phone = document.getElementById('teacherPhoneInput').value.trim();
            const commType = document.querySelector('input[name="commissionType"]:checked').value;
            const commVal = parseFloat(document.getElementById('teacherCommValueInput').value);

            try {
                const response = await fetch('/api/teachers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-center-id': centerId },
                    body: JSON.stringify({
                        name,
                        subject,
                        phone,
                        commission_type: commType,
                        commission_value: commVal
                    })
                });

                const resData = await response.json();
                if (resData.success) {
                    closeAddTeacherModal();
                    showToast(`تم حفظ بيانات المدرس ${name} بنجاح`);
                    fetchTeachersFromApi();
                } else {
                    showToast(resData.message || 'حدث خطأ أثناء الحفظ');
                }
            } catch (err) {
                showToast('خطأ في الاتصال بالسيرفر');
            }
        }

        function openAddGroupModal() {
            document.getElementById('addGroupModal').classList.remove('hidden');
        }
        function closeAddGroupModal() {
            document.getElementById('addGroupModal').classList.add('hidden');
            document.getElementById('addGroupForm').reset();
        }

        function handleCreateGroup(e) {
            e.preventDefault();
            closeAddGroupModal();
            showToast('تم حفظ المجموعة بنجاح');
        }

        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
