<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full bg-slate-950 selection:bg-indigo-500 selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي للطالب | CenterZone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <script src="js/app-core.js"></script>
    <!-- Collapsible Sidebar Styles & Navigation Script -->
    <link rel="stylesheet" href="css/sidebar.css">
    <script src="js/sidebar-navigation.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .bg-grid-pattern {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-[#0B0F19] text-gray-100 flex min-h-screen antialiased overflow-x-hidden">
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <div id="main-wrapper" class="main-transition flex-1 flex flex-col min-h-screen mr-64 p-6">
        <div id="main-content-area" class="w-full h-full">
            <header class="bg-slate-900/90 border-b border-slate-800/80 backdrop-blur-md sticky top-0 z-40 shadow-lg rounded-2xl mb-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
            
            <div class="flex items-center gap-2.5">
                <a href="students.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-arrow-right"></i>
                    العودة للقائمة
                </a>
            </div>

            <div class="flex items-center text-left">
                <div class="text-left" style="direction: ltr;">
                    <h1 class="font-bold text-lg text-white leading-tight">الملف الشخصي للطالب</h1>
                    <p class="text-[11px] text-slate-400 font-mono" id="headerCenterName">السنتر الحالي</p>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <div id="loading" class="text-center py-12 text-lg font-bold text-slate-400 flex flex-col items-center gap-3">
            <i class="fa-solid fa-circle-notch fa-spin text-indigo-500 text-3xl"></i>
            جاري تحميل البيانات...
        </div>

        <div id="profileContent" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Basic Info Card -->
            <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 lg:col-span-1 shadow-xl border-t-4 border-t-indigo-500 flex flex-col">
                <div class="text-center mb-6">
                    <div class="w-24 h-24 bg-gradient-to-tr from-indigo-600 to-purple-600 text-white rounded-full flex items-center justify-center text-4xl mx-auto mb-4 shadow-lg shadow-indigo-500/30">
                        <i class="fas fa-user-graduate"></i>
                    </div>
                    <h2 id="stName" class="text-2xl font-black text-white">...</h2>
                    <p id="stCode" class="text-slate-400 font-mono mt-1 tracking-wider">...</p>
                </div>
                
                <div class="space-y-4 flex-1">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                        <span class="text-slate-400 text-sm font-medium">الصف الدراسي:</span>
                        <span id="stGrade" class="font-bold text-slate-200">...</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                        <span class="text-slate-400 text-sm font-medium">موبايل الطالب:</span>
                        <span id="stPhone" class="font-bold text-slate-200 font-mono">...</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                        <span class="text-slate-400 text-sm font-medium">موبايل ولي الأمر:</span>
                        <span id="stParentPhone" class="font-bold text-sky-400 font-mono">...</span>
                    </div>
                    <div class="flex justify-between items-start pt-2">
                        <span class="text-slate-400 text-sm font-medium mt-1">رصيد الحصص:</span>
                        <div id="stSessions" class="text-left">...</div>
                    </div>
                </div>

                <div class="mt-8 text-center">
                    <button onclick="openRechargeModal()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center gap-2">
                        <i class="fas fa-wallet"></i> شحن رصيد حصص
                    </button>
                </div>
            </div>

            <!-- Detailed Tabs -->
            <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-xl lg:col-span-2 overflow-hidden flex flex-col">
                <div class="flex border-b border-slate-800 bg-slate-950/50">
                    <button onclick="switchTab('attendance')" class="flex-1 py-4 text-center font-bold text-indigo-400 border-b-2 border-indigo-500 tab-btn transition-colors text-sm" data-target="attendance">
                        <i class="fas fa-calendar-check ml-1.5"></i> الحضور والغياب
                    </button>
                    <button onclick="switchTab('financials')" class="flex-1 py-4 text-center font-bold text-slate-500 hover:text-slate-300 tab-btn transition-colors text-sm" data-target="financials">
                        <i class="fas fa-file-invoice-dollar ml-1.5"></i> المالية والمدفوعات
                    </button>
                    <button onclick="switchTab('grades')" class="flex-1 py-4 text-center font-bold text-slate-500 hover:text-slate-300 tab-btn transition-colors text-sm" data-target="grades">
                        <i class="fas fa-star ml-1.5"></i> التقييم والدرجات
                    </button>
                </div>

                <div class="p-6 flex-1 overflow-y-auto max-h-[600px] custom-scrollbar">
                    <!-- Attendance Tab -->
                    <div id="tab-attendance" class="tab-content block">
                        <div class="overflow-x-auto">
                            <table class="w-full text-right text-sm">
                                <thead class="bg-slate-950/80 text-slate-400">
                                    <tr>
                                        <th class="px-4 py-3 font-semibold rounded-r-xl">التاريخ</th>
                                        <th class="px-4 py-3 font-semibold">المجموعة</th>
                                        <th class="px-4 py-3 font-semibold rounded-l-xl">الحالة</th>
                                    </tr>
                                </thead>
                                <tbody id="attendanceList" class="divide-y divide-slate-800/60 text-slate-200"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Financials Tab -->
                    <div id="tab-financials" class="tab-content hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-right text-sm">
                                <thead class="bg-slate-950/80 text-slate-400">
                                    <tr>
                                        <th class="px-4 py-3 font-semibold rounded-r-xl">التاريخ</th>
                                        <th class="px-4 py-3 font-semibold">المبلغ</th>
                                        <th class="px-4 py-3 font-semibold rounded-l-xl">البيان</th>
                                    </tr>
                                </thead>
                                <tbody id="financialsList" class="divide-y divide-slate-800/60 text-slate-200"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Grades Tab -->
                    <div id="tab-grades" class="tab-content hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-right text-sm">
                                <thead class="bg-slate-950/80 text-slate-400">
                                    <tr>
                                        <th class="px-4 py-3 font-semibold rounded-r-xl">الامتحان/التسميع</th>
                                        <th class="px-4 py-3 font-semibold">الدرجة</th>
                                        <th class="px-4 py-3 font-semibold rounded-l-xl">النسبة المئوية</th>
                                    </tr>
                                </thead>
                                <tbody id="gradesList" class="divide-y divide-slate-800/60 text-slate-200"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Recharge Modal -->
    <div id="rechargeModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-[400px] max-w-full shadow-2xl">
            <h3 class="text-lg font-bold mb-5 text-white border-b border-slate-800 pb-3 flex items-center gap-2">
                <i class="fa-solid fa-wallet text-emerald-500"></i> شحن رصيد الطالب
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1.5">المجموعة المستهدفة *</label>
                    <select id="chargeGroup" onchange="calculateNetPrice()" class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2.5 text-xs focus:ring-2 focus:ring-emerald-500 outline-none shadow-inner transition-all">
                        <option value="">اختر المجموعة...</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5">عدد الحصص</label>
                        <input type="number" id="chargeSessions" value="4" class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2.5 text-xs focus:ring-2 focus:ring-emerald-500 outline-none shadow-inner transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5">المبلغ (جنيه)</label>
                        <input type="number" id="chargeAmount" class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2.5 text-xs focus:ring-2 focus:ring-emerald-500 outline-none shadow-inner transition-all">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1.5">ملاحظات / خصم (اختياري)</label>
                    <input type="text" id="chargeDiscount" placeholder="مثال: قسط أول، مذكرة عربي..." class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2.5 text-xs focus:ring-2 focus:ring-emerald-500 outline-none shadow-inner transition-all">
                </div>
                <div id="priceBreakdown" class="hidden bg-slate-950/50 border border-slate-800/80 p-3 rounded-2xl text-[11px] text-slate-300 space-y-1"></div>
            </div>
            <div class="mt-6 flex gap-3">
                <button onclick="submitRecharge()" class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-2.5 rounded-xl transition-all shadow-lg shadow-emerald-500/20 text-sm">تأكيد الشحن</button>
                <button onclick="closeRechargeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 font-bold py-2.5 rounded-xl transition-all text-sm">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('id');
        let currentStudentData = null;

        if (!studentId) {
            window.showToast?.("رقم الطالب غير متوفر", "error");
            setTimeout(() => { window.location.href = 'students.html'; }, 1500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const el = document.getElementById('headerCenterName');
            if (el && window.getActiveCenterHeader) el.textContent = window.getActiveCenterHeader();
            fetchStudentData();
        });

        async function fetchStudentData() {
            try {
                const response = await window.fetchWithCenter(`${window.API_BASE_URL}/students/${studentId}`);
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    throw new Error(data.message || 'Error fetching profile');
                }
                
                currentStudentData = data.data;
                renderProfile(data.data);
            } catch (err) {
                window.showToast?.("فشل في تحميل بيانات الطالب", "error");
                const loadingEl = document.getElementById('loading');
                if (loadingEl) loadingEl.innerText = "حدث خطأ أثناء تحميل الملف الشخصي للطالب";
            }
        }

        function renderProfile(student) {
            const loadingEl = document.getElementById('loading');
            const profileEl = document.getElementById('profileContent');
            if (loadingEl) loadingEl.classList.add('hidden');
            if (profileEl) profileEl.classList.remove('hidden');
            
            const sName = student.name || student.studentName || '---';
            const sCode = student.code || student.studentCode || '---';
            const sPhone = student.studentPhone || '---';
            const sParentPhone = student.parentPhone || '---';

            document.getElementById('stName').innerText = sName;
            document.getElementById('stCode').innerText = sCode;
            document.getElementById('stGrade').innerText = student.grade || "غير محدد";
            document.getElementById('stPhone').innerText = sPhone;
            document.getElementById('stParentPhone').innerText = sParentPhone;
            
            const sessionsBadge = document.getElementById('stSessions');
            if (sessionsBadge) {
                sessionsBadge.className = 'flex flex-col gap-1';
                sessionsBadge.innerHTML = (student.enrollments || []).map(en => {
                    const gName = en.group?.name || en.group?.groupName || 'مجموعة';
                    const rem = en.remainingSessions ?? 0;
                    const cls = rem <= 0 
                        ? 'font-bold text-sm text-rose-600 px-3 py-1 bg-rose-100 rounded-full w-max'
                        : 'font-bold text-sm text-emerald-600 px-3 py-1 bg-emerald-100 rounded-full w-max';
                    return `<span class="${cls}">${gName}: ${rem} حصص</span>`;
                }).join('') || '<span class="font-bold text-sm text-slate-500 px-3 py-1 bg-slate-100 rounded-full">غير مسجل</span>';
            }

            const attList = document.getElementById('attendanceList');
            if (attList) {
                attList.innerHTML = (student.attendances || []).map(a => {
                    const gName = a.group?.name || a.group?.groupName || '---';
                    return `
                        <tr class="hover:bg-slate-800/40 transition">
                            <td class="px-4 py-3">${new Date(a.date).toLocaleDateString('ar-EG')}</td>
                            <td class="px-4 py-3">${gName}</td>
                            <td class="px-4 py-3">
                                <span class="px-2 py-1 text-xs rounded-full ${a.status === 'PRESENT' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}">
                                    ${a.status === 'PRESENT' ? 'حاضر' : 'غائب'}
                                </span>
                            </td>
                        </tr>
                    `;
                }).join('') || '<tr><td colspan="3" class="px-4 py-3 text-center text-slate-500 font-bold">لا يوجد سجل حضور للمجموعات حالياً</td></tr>';
            }

            const finList = document.getElementById('financialsList');
            if (finList) {
                finList.innerHTML = (student.feePayments || []).map(f => {
                    const typeLabel = f.paymentType === 'MONTHLY' ? 'شحن رصيد شهري' : (f.paymentType === 'BOOKLET_ONLY' ? 'شراء مذكرة' : f.paymentType || 'مدفوعات أخرى');
                    return `
                        <tr class="hover:bg-slate-800/40 transition">
                            <td class="px-4 py-3">${new Date(f.createdAt).toLocaleDateString('ar-EG')}</td>
                            <td class="px-4 py-3 font-bold text-emerald-400">${f.amount} ج.م</td>
                            <td class="px-4 py-3">${typeLabel}</td>
                        </tr>
                    `;
                }).join('') || '<tr><td colspan="3" class="px-4 py-3 text-center text-slate-500 font-bold">لا توجد عمليات دفع مسجلة لهذا الطالب</td></tr>';
            }

            const grdList = document.getElementById('gradesList');
            if (grdList) {
                grdList.innerHTML = (student.studentGrades || []).map(g => {
                    const gradeVal = parseFloat(g.score ?? g.grade ?? 0);
                    const maxVal = parseFloat(g.assessment?.maxScore ?? 100);
                    const perc = maxVal > 0 ? ((gradeVal / maxVal) * 100).toFixed(1) : '0';
                    return `
                        <tr class="hover:bg-slate-800/40 transition">
                            <td class="px-4 py-3">${g.assessment?.title || 'تقييم'}</td>
                            <td class="px-4 py-3 font-bold text-indigo-400">${gradeVal} / ${maxVal}</td>
                            <td class="px-4 py-3">
                                <div class="w-full bg-slate-950 rounded-full h-2.5 border border-slate-800">
                                  <div class="bg-indigo-500 h-2 rounded-full" style="width: ${perc}%"></div>
                                </div>
                                <span class="text-xs text-slate-400">${perc}%</span>
                            </td>
                        </tr>
                    `;
                }).join('') || '<tr><td colspan="3" class="px-4 py-3 text-center text-slate-500 font-bold">لا يوجد درجات مسجلة في الامتحانات</td></tr>';
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('block');
                el.classList.add('hidden');
            });
            const activeTab = document.getElementById(`tab-${tabId}`);
            if (activeTab) {
                activeTab.classList.remove('hidden');
                activeTab.classList.add('block');
            }
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('text-indigo-400', 'border-indigo-500');
                btn.classList.add('text-slate-500', 'border-transparent');
            });
            
            const activeBtn = document.querySelector(`.tab-btn[data-target="${tabId}"]`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-500', 'border-transparent');
                activeBtn.classList.add('text-indigo-400', 'border-indigo-500');
            }
        }

        function calculateNetPrice() {
            const groupSelect = document.getElementById('chargeGroup');
            const breakdownEl = document.getElementById('priceBreakdown');
            const amountInput = document.getElementById('chargeAmount');
            
            if (!groupSelect || !currentStudentData) return;
            
            const selectedGroupId = groupSelect.value;
            if (!selectedGroupId) {
                if (breakdownEl) breakdownEl.classList.add('hidden');
                if (amountInput) amountInput.value = '';
                return;
            }
            
            const enrollment = (currentStudentData.enrollments || []).find(en => en.groupId === selectedGroupId);
            if (!enrollment || !enrollment.group) {
                if (breakdownEl) breakdownEl.classList.add('hidden');
                return;
            }
            
            const basePrice = enrollment.group.price || 0;
            const discType = currentStudentData.discountType || '';
            const discVal = currentStudentData.discountValue || 0;
            
            let discountAmount = 0;
            let discountLabel = '';
            
            if (discType === '%' || discType === 'PERCENTAGE') {
                discountAmount = (basePrice * discVal) / 100;
                discountLabel = `${discVal}%`;
            } else if (discType === 'Fixed EGP' || discType === 'FIXED') {
                discountAmount = discVal;
                discountLabel = `${discVal} ج.م`;
            }
            
            const finalPayable = Math.max(0, basePrice - discountAmount);
            
            if (amountInput) {
                amountInput.value = finalPayable;
            }
            
            if (breakdownEl) {
                breakdownEl.classList.remove('hidden');
                if (discountAmount > 0) {
                    breakdownEl.innerHTML = `
                        <div class="flex justify-between"><span>سعر المجموعة الأساسي:</span> <span class="font-bold text-white">${basePrice} ج.م</span></div>
                        <div class="flex justify-between text-rose-450"><span>الخصم المطبق (${discountLabel}):</span> <span>-${discountAmount} ج.م</span></div>
                        <div class="flex justify-between border-t border-slate-800 pt-1.5 font-bold text-emerald-400"><span>المبلغ المستحق للدفع:</span> <span>${finalPayable} ج.م</span></div>
                    `;
                } else {
                    breakdownEl.innerHTML = `
                        <div class="flex justify-between"><span>سعر المجموعة الأساسي:</span> <span class="font-bold text-white">${basePrice} ج.م</span></div>
                        <div class="flex justify-between text-slate-400"><span>الخصم المطبق:</span> <span>لا يوجد خصم دائم</span></div>
                        <div class="flex justify-between border-t border-slate-800 pt-1.5 font-bold text-emerald-400"><span>المبلغ المستحق للدفع:</span> <span>${finalPayable} ج.م</span></div>
                    `;
                }
            }
        }

        function openRechargeModal() {
            const modal = document.getElementById('rechargeModal');
            if (modal) modal.classList.remove('hidden');
            
            const breakdownEl = document.getElementById('priceBreakdown');
            if (breakdownEl) breakdownEl.classList.add('hidden');
            
            const amountInput = document.getElementById('chargeAmount');
            if (amountInput) amountInput.value = '';
            
            const groupSelect = document.getElementById('chargeGroup');
            if (groupSelect && currentStudentData) {
                groupSelect.innerHTML = '<option value="">اختر المجموعة...</option>';
                (currentStudentData.enrollments || []).forEach(en => {
                    const gName = en.group?.name || en.group?.groupName || 'مجموعة';
                    groupSelect.insertAdjacentHTML('beforeend', `<option value="${en.groupId}">${gName}</option>`);
                });
            }
        }

        function closeRechargeModal() {
            const modal = document.getElementById('rechargeModal');
            if (modal) modal.classList.add('hidden');
        }

        async function submitRecharge() {
            const amount = document.getElementById('chargeAmount').value;
            const sessions = document.getElementById('chargeSessions').value;
            const discountNote = document.getElementById('chargeDiscount').value;
            const groupSelect = document.getElementById('chargeGroup');
            const groupId = groupSelect ? groupSelect.value : '';
            
            if (!amount || !sessions) {
                window.showToast?.("برجاء إدخال المبلغ وعدد الحصص", "warning");
                return;
            }
            
            if (groupSelect && !groupId) {
                window.showToast?.("برجاء اختيار المجموعة المستهدفة", "warning");
                return;
            }

            try {
                const response = await window.fetchWithCenter(`${window.API_BASE_URL}/students/${studentId}/pay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount, sessions: parseInt(sessions), discountNote, groupId })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    window.showToast?.("تم شحن الرصيد بنجاح", "success");
                    closeRechargeModal();
                    fetchStudentData();
                } else {
                    throw new Error(data.message || 'فشل في عملية الشحن');
                }
            } catch (err) {
                window.showToast?.(err.message, "error");
            }
        }
    </script>
        </div><!-- End of #main-content-area -->
    </div><!-- End of #main-wrapper -->
</body>
</html>
