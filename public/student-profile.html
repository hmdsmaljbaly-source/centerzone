<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي للطالب | CenterZone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <script src="js/app-core.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 p-6">
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header Section -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-indigo-700 dark:text-indigo-400">الملف الشخصي للطالب</h1>
            <a href="students.html" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded shadow transition">
                <i class="fas fa-arrow-right ml-2"></i> رجوع للقائمة
            </a>
        </div>

        <div id="loading" class="text-center py-10 text-xl font-bold">جاري تحميل البيانات...</div>

        <!-- Main Content -->
        <div id="profileContent" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Basic Info Card -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 col-span-1 border-t-4 border-indigo-500">
                <div class="text-center mb-6">
                    <div class="w-24 h-24 bg-indigo-100 text-indigo-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-4">
                        <i class="fas fa-user-graduate"></i>
                    </div>
                    <h2 id="stName" class="text-2xl font-bold text-gray-900 dark:text-white">...</h2>
                    <p id="stCode" class="text-gray-500 font-mono mt-1">...</p>
                </div>
                
                <div class="space-y-4">
                    <div class="flex justify-between border-b pb-2">
                        <span class="text-gray-500">الصف الدراسي:</span>
                        <span id="stGrade" class="font-bold">...</span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="text-gray-500">موبايل الطالب:</span>
                        <span id="stPhone" class="font-bold">...</span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="text-gray-500">موبايل ولي الأمر:</span>
                        <span id="stParentPhone" class="font-bold text-blue-600">...</span>
                    </div>
                    <div class="flex justify-between pt-2">
                        <span class="text-gray-500">الرصيد المتبقي:</span>
                        <span id="stSessions" class="font-bold text-lg text-emerald-600 px-3 py-1 bg-emerald-100 rounded-full">...</span>
                    </div>
                </div>

                <div class="mt-6 text-center">
                    <button onclick="openRechargeModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded transition">
                        <i class="fas fa-wallet ml-2"></i> شحن رصيد حصص
                    </button>
                </div>
            </div>

            <!-- Detailed Tabs -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md col-span-1 md:col-span-2 overflow-hidden">
                <div class="flex border-b">
                    <button onclick="switchTab('attendance')" class="flex-1 py-3 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 tab-btn" data-target="attendance">
                        <i class="fas fa-calendar-check ml-1"></i> الحضور والغياب
                    </button>
                    <button onclick="switchTab('financials')" class="flex-1 py-3 text-center font-bold text-gray-500 hover:text-gray-700 tab-btn" data-target="financials">
                        <i class="fas fa-file-invoice-dollar ml-1"></i> المالية والمدفوعات
                    </button>
                    <button onclick="switchTab('grades')" class="flex-1 py-3 text-center font-bold text-gray-500 hover:text-gray-700 tab-btn" data-target="grades">
                        <i class="fas fa-star ml-1"></i> الدرجات والتقييم
                    </button>
                </div>

                <div class="p-6 h-[500px] overflow-y-auto">
                    <!-- Attendance Tab -->
                    <div id="tab-attendance" class="tab-content">
                        <table class="min-w-full divide-y divide-gray-200 text-right">
                            <thead>
                                <tr class="bg-gray-50 dark:bg-gray-700">
                                    <th class="px-4 py-2">التاريخ</th>
                                    <th class="px-4 py-2">المجموعة</th>
                                    <th class="px-4 py-2">الحالة</th>
                                </tr>
                            </thead>
                            <tbody id="attendanceList" class="divide-y divide-gray-100"></tbody>
                        </table>
                    </div>

                    <!-- Financials Tab -->
                    <div id="tab-financials" class="tab-content hidden">
                        <table class="min-w-full divide-y divide-gray-200 text-right">
                            <thead>
                                <tr class="bg-gray-50 dark:bg-gray-700">
                                    <th class="px-4 py-2">التاريخ</th>
                                    <th class="px-4 py-2">المبلغ</th>
                                    <th class="px-4 py-2">البيان</th>
                                </tr>
                            </thead>
                            <tbody id="financialsList" class="divide-y divide-gray-100"></tbody>
                        </table>
                    </div>

                    <!-- Grades Tab -->
                    <div id="tab-grades" class="tab-content hidden">
                        <table class="min-w-full divide-y divide-gray-200 text-right">
                            <thead>
                                <tr class="bg-gray-50 dark:bg-gray-700">
                                    <th class="px-4 py-2">الامتحان/التسميع</th>
                                    <th class="px-4 py-2">الدرجة</th>
                                    <th class="px-4 py-2">النسبة</th>
                                </tr>
                            </thead>
                            <tbody id="gradesList" class="divide-y divide-gray-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Recharge Modal -->
    <div id="rechargeModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white dark:bg-gray-800 rounded-lg p-6 w-96 max-w-full shadow-2xl">
            <h3 class="text-xl font-bold mb-4 text-gray-900 dark:text-white">شحن رصيد للطالب</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">عدد الحصص</label>
                    <input type="number" id="chargeSessions" value="4" class="w-full border p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">المبلغ المدفوع (جنيه)</label>
                    <input type="number" id="chargeAmount" class="w-full border p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">ملاحظات / خصم (اختياري)</label>
                    <input type="text" id="chargeDiscount" placeholder="مثال: خصم 10% أخ" class="w-full border p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>
            <div class="mt-6 flex gap-3">
                <button onclick="submitRecharge()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded transition">تأكيد الشحن</button>
                <button onclick="closeRechargeModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 rounded transition">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="js/student-profile.js"></script>
</body>
</html>
