<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full bg-slate-950 selection:bg-indigo-500 selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي للطالب | CenterZone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <script src="js/app-core.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .bg-grid-pattern {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased flex flex-col bg-grid-pattern min-h-screen">
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <header class="bg-slate-900/90 border-b border-slate-800/80 backdrop-blur-md sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
            
            <div class="flex items-center gap-2.5">
                <a href="students.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-arrow-right"></i>
                    العودة للقائمة
                </a>
            </div>

            <div class="flex items-center text-left">
                <div class="text-left" style="direction: ltr;">
                    <h1 class="font-bold text-lg text-white leading-tight">الملف الشخصي للطالب</h1>
                    <p class="text-[11px] text-slate-400 font-mono" id="headerCenterName">السنتر الحالي</p>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <div id="loading" class="text-center py-12 text-lg font-bold text-slate-400 flex flex-col items-center gap-3">
            <i class="fa-solid fa-circle-notch fa-spin text-indigo-500 text-3xl"></i>
            جاري تحميل البيانات...
        </div>

        <div id="profileContent" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Basic Info Card -->
            <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 lg:col-span-1 shadow-xl border-t-4 border-t-indigo-500 flex flex-col">
                <div class="text-center mb-6">
                    <div class="w-24 h-24 bg-gradient-to-tr from-indigo-600 to-purple-600 text-white rounded-full flex items-center justify-center text-4xl mx-auto mb-4 shadow-lg shadow-indigo-500/30">
                        <i class="fas fa-user-graduate"></i>
                    </div>
                    <h2 id="stName" class="text-2xl font-black text-white">...</h2>
                    <p id="stCode" class="text-slate-400 font-mono mt-1 tracking-wider">...</p>
                </div>
                
                <div class="space-y-4 flex-1">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                        <span class="text-slate-400 text-sm font-medium">الصف الدراسي:</span>
                        <span id="stGrade" class="font-bold text-slate-200">...</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                        <span class="text-slate-400 text-sm font-medium">موبايل الطالب:</span>
                        <span id="stPhone" class="font-bold text-slate-200 font-mono">...</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                        <span class="text-slate-400 text-sm font-medium">موبايل ولي الأمر:</span>
                        <span id="stParentPhone" class="font-bold text-sky-400 font-mono">...</span>
                    </div>
                    <div class="flex justify-between items-start pt-2">
                        <span class="text-slate-400 text-sm font-medium mt-1">رصيد الحصص:</span>
                        <div id="stSessions" class="text-left">...</div>
                    </div>
                </div>

                <div class="mt-8 text-center">
                    <button onclick="openRechargeModal()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center gap-2">
                        <i class="fas fa-wallet"></i> شحن رصيد حصص
                    </button>
                </div>
            </div>

            <!-- Detailed Tabs -->
            <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-xl lg:col-span-2 overflow-hidden flex flex-col">
                <div class="flex border-b border-slate-800 bg-slate-950/50">
                    <button onclick="switchTab('attendance')" class="flex-1 py-4 text-center font-bold text-indigo-400 border-b-2 border-indigo-500 tab-btn transition-colors text-sm" data-target="attendance">
                        <i class="fas fa-calendar-check ml-1.5"></i> الحضور والغياب
                    </button>
                    <button onclick="switchTab('financials')" class="flex-1 py-4 text-center font-bold text-slate-500 hover:text-slate-300 tab-btn transition-colors text-sm" data-target="financials">
                        <i class="fas fa-file-invoice-dollar ml-1.5"></i> المالية والمدفوعات
                    </button>
                    <button onclick="switchTab('grades')" class="flex-1 py-4 text-center font-bold text-slate-500 hover:text-slate-300 tab-btn transition-colors text-sm" data-target="grades">
                        <i class="fas fa-star ml-1.5"></i> التقييم والدرجات
                    </button>
                </div>

                <div class="p-6 flex-1 overflow-y-auto max-h-[600px] custom-scrollbar">
                    <!-- Attendance Tab -->
                    <div id="tab-attendance" class="tab-content block">
                        <div class="overflow-x-auto">
                            <table class="w-full text-right text-sm">
                                <thead class="bg-slate-950/80 text-slate-400">
                                    <tr>
                                        <th class="px-4 py-3 font-semibold rounded-r-xl">التاريخ</th>
                                        <th class="px-4 py-3 font-semibold">المجموعة</th>
                                        <th class="px-4 py-3 font-semibold rounded-l-xl">الحالة</th>
                                    </tr>
                                </thead>
                                <tbody id="attendanceList" class="divide-y divide-slate-800/60 text-slate-200"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Financials Tab -->
                    <div id="tab-financials" class="tab-content hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-right text-sm">
                                <thead class="bg-slate-950/80 text-slate-400">
                                    <tr>
                                        <th class="px-4 py-3 font-semibold rounded-r-xl">التاريخ</th>
                                        <th class="px-4 py-3 font-semibold">المبلغ</th>
                                        <th class="px-4 py-3 font-semibold rounded-l-xl">البيان</th>
                                    </tr>
                                </thead>
                                <tbody id="financialsList" class="divide-y divide-slate-800/60 text-slate-200"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Grades Tab -->
                    <div id="tab-grades" class="tab-content hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-right text-sm">
                                <thead class="bg-slate-950/80 text-slate-400">
                                    <tr>
                                        <th class="px-4 py-3 font-semibold rounded-r-xl">الامتحان/التسميع</th>
                                        <th class="px-4 py-3 font-semibold">الدرجة</th>
                                        <th class="px-4 py-3 font-semibold rounded-l-xl">النسبة المئوية</th>
                                    </tr>
                                </thead>
                                <tbody id="gradesList" class="divide-y divide-slate-800/60 text-slate-200"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Recharge Modal -->
    <div id="rechargeModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-[400px] max-w-full shadow-2xl">
            <h3 class="text-lg font-bold mb-5 text-white border-b border-slate-800 pb-3 flex items-center gap-2">
                <i class="fa-solid fa-wallet text-emerald-500"></i> شحن رصيد الطالب
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1.5">المجموعة المستهدفة *</label>
                    <select id="chargeGroup" class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2.5 text-xs focus:ring-2 focus:ring-emerald-500 outline-none shadow-inner transition-all">
                        <option value="">اختر المجموعة...</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5">عدد الحصص</label>
                        <input type="number" id="chargeSessions" value="4" class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2.5 text-xs focus:ring-2 focus:ring-emerald-500 outline-none shadow-inner transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5">المبلغ (جنيه)</label>
                        <input type="number" id="chargeAmount" class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2.5 text-xs focus:ring-2 focus:ring-emerald-500 outline-none shadow-inner transition-all">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1.5">ملاحظات / خصم (اختياري)</label>
                    <input type="text" id="chargeDiscount" placeholder="مثال: خصم 10% أخ" class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2.5 text-xs focus:ring-2 focus:ring-emerald-500 outline-none shadow-inner transition-all">
                </div>
            </div>
            <div class="mt-6 flex gap-3">
                <button onclick="submitRecharge()" class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-2.5 rounded-xl transition-all shadow-lg shadow-emerald-500/20 text-sm">تأكيد الشحن</button>
                <button onclick="closeRechargeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 font-bold py-2.5 rounded-xl transition-all text-sm">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="js/student-profile.js"></script>
    <script>
        // Update tab styling logic to match new UI
        window.originalSwitchTab = window.switchTab;
        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('block');
                el.classList.add('hidden');
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.add('block');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('text-indigo-400', 'border-indigo-500');
                btn.classList.add('text-slate-500', 'border-transparent');
            });
            
            const activeBtn = document.querySelector(`.tab-btn[data-target="${tabId}"]`);
            if(activeBtn) {
                activeBtn.classList.remove('text-slate-500', 'border-transparent');
                activeBtn.classList.add('text-indigo-400', 'border-indigo-500');
            }
        };
    </script>
</body>
</html>
