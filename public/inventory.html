<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full bg-slate-950 text-slate-100 antialiased flex flex-col bg-grid-pattern">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المطبوعات ومخزن الملازم POS - نظام السناتر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Cairo', 'Inter', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .bg-grid-pattern {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased flex flex-col bg-grid-pattern">

    <header class="bg-slate-900/90 border-b border-slate-800/80 backdrop-blur-md sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3 space-x-reverse">
                <a href="/index.html" class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-600 p-0.5 shadow-lg shadow-amber-500/20 hover:scale-105 transition-transform flex items-center justify-center">
                    <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center text-amber-400 font-black text-lg">
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </a>
                <div>
                    <h1 class="font-bold text-lg text-white leading-tight">إدارة المطبوعات ومخزن الملازم (POS)</h1>
                    <p class="text-xs text-slate-400">سنتر النخبة التعليمي - الفرع الرئيسي</p>
                </div>
            </div>

            <div class="flex items-center gap-2.5">
                <a href="/students.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sky-400 rounded-xl text-xs font-bold transition-all">
                    <i class="fa-solid fa-users ml-1"></i> إدارة الطلاب
                </a>
                <a href="/index.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-xl text-xs font-bold transition-all">
                    <i class="fa-solid fa-gauge-high ml-1"></i> العودة للرئيسية
                </a>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex items-center justify-between flex-wrap gap-2">
            <h3 class="text-sm font-bold text-white">قائمة الملازم والمطبوعات المتاحة بالمخزن</h3>
            <button onclick="openPosModal()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow-md flex items-center gap-1.5">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>🛒 منفذ بيع سريع (POS)</span>
            </button>
        </section>

        <section class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-xs text-right text-slate-300">
                    <thead class="bg-slate-950/80 text-slate-400 font-semibold border-b border-slate-800">
                        <tr>
                            <th class="p-3.5">اسم الملزمة / المطبوعة</th>
                            <th class="p-3.5">السعر (ج.م)</th>
                            <th class="p-3.5">الكمية بالمخزن</th>
                            <th class="p-3.5 text-center">البيع السريع</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody" class="divide-y divide-slate-800/60">
                        <!-- Populated via API -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <div id="posModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-sm font-bold text-white">منفذ بيع الملازم المباشر (POS Sale)</h3>
                <button onclick="closePosModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="posForm" onsubmit="handleExecutePosSale(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">اختر الملزمة المراد بيعها *</label>
                    <select id="posBookSelect" required class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3.5 py-2.5 text-xs outline-none">
                        <!-- Populated via API -->
                    </select>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button type="button" onclick="closePosModal()" class="px-4 py-2 bg-slate-800 text-slate-300 text-xs rounded-xl font-bold">إلغاء</button>
                    <button type="submit" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs rounded-xl font-bold shadow-md">تأكيد البيع وخصم المخزون</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastNotification" class="fixed bottom-5 left-5 z-50 bg-slate-800 border border-slate-700 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-2xl transition-all duration-300 transform translate-y-20 opacity-0">
        <span id="toastMessage">إشعار النظام</span>
    </div>

    <script>
        const centerId = localStorage.getItem('centerId') || 'center-101';
        let inventoryBooks = [];
        let studentsList = [];

        window.onload = function() {
            fetchInventoryFromApi();
            fetchStudentsFromApi();
        };

        async function fetchInventoryFromApi() {
            try {
                const response = await fetch('/api/inventory', {
                    headers: { 'x-center-id': centerId }
                });
                const resData = await response.json();
                if (resData.success && Array.isArray(resData.data)) {
                    inventoryBooks = resData.data;
                    renderInventoryTable(inventoryBooks);
                    updateInventoryMetrics();
                }
            } catch (e) {
                console.error("Error fetching inventory:", e);
            }
        }

        async function fetchStudentsFromApi() {
            try {
                const response = await fetch('/api/students', {
                    headers: { 'x-center-id': centerId }
                });
                const resData = await response.json();
                if (resData.success && Array.isArray(resData.data)) {
                    studentsList = resData.data;
                }
            } catch (e) {
                console.error("Error fetching students:", e);
            }
        }

        function filterBooksInventory() {
            const query = document.getElementById('inventorySearchInput').value.trim().toLowerCase();

            const filtered = inventoryBooks.filter(bk => {
                const name = bk.service_name || bk.title || '';
                return !query || name.toLowerCase().includes(query);
            });

            renderInventoryTable(filtered);
        }

        function renderInventoryTable(booksList) {
            const tbody = document.getElementById('inventoryTableBody');
            const emptyState = document.getElementById('inventoryEmptyState');
            tbody.innerHTML = '';

            if (!booksList || booksList.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            booksList.forEach(bk => {
                const stock = bk.stock_quantity || bk.stock || 0;
                let badgeClass = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                let statusLabel = '🟢 متوفر بالمخزن';

                if (stock === 0) {
                    badgeClass = 'bg-rose-500/10 text-rose-400 border-rose-500/20';
                    statusLabel = '🔴 نفذت الكمية';
                } else if (stock <= 10) {
                    badgeClass = 'bg-amber-500/10 text-amber-300 border-amber-500/20';
                    statusLabel = '🟡 مخزون منخفض';
                }

                const rowHtml = `
                    <tr class="hover:bg-slate-800/40 transition-colors">
                        <td class="p-3.5 font-bold text-white flex items-center gap-2">
                            <i class="fa-solid fa-book-open text-amber-400"></i>
                            ${bk.service_name || bk.title}
                        </td>
                        <td class="p-3.5 text-purple-300 font-semibold">${bk.teacher ? bk.teacher.name : '--'}</td>
                        <td class="p-3.5 text-slate-400">--</td>
                        <td class="p-3.5 font-mono font-bold text-emerald-400">${bk.price} ج.م</td>
                        <td class="p-3.5 font-mono font-bold text-slate-200">${stock} نسخة</td>
                        <td class="p-3.5">
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold border inline-block ${badgeClass}">
                                ${statusLabel}
                            </span>
                        </td>
                        <td class="p-3.5 text-center">
                            <button onclick="openPosModal('${bk.id}')" ${stock === 0 ? 'disabled' : ''} 
                                class="px-3 py-1.5 bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white border border-emerald-500/30 rounded-xl text-xs font-bold disabled:opacity-30 disabled:cursor-not-allowed transition-all">
                                🛒 بيع سريع
                            </button>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', rowHtml);
            });
        }

        function updateInventoryMetrics() {
            const totalStock = inventoryBooks.reduce((acc, curr) => acc + (curr.stock_quantity || 0), 0);
            const lowStockCount = inventoryBooks.filter(bk => (bk.stock_quantity || 0) > 0 && (bk.stock_quantity || 0) <= 10).length;
            const outOfStockCount = inventoryBooks.filter(bk => (bk.stock_quantity || 0) === 0).length;

            document.getElementById('metricTotalStock').textContent = totalStock.toLocaleString();
            document.getElementById('metricLowStock').textContent = lowStockCount;
            document.getElementById('metricOutOfStock').textContent = outOfStockCount;
        }

        function openPosModal(preSelectedBookId = null) {
            const stuSelect = document.getElementById('posStudentSelect');
            stuSelect.innerHTML = studentsList.map(s => `<option value="${s.id}">${s.name} (${s.code || s.student_code})</option>`).join('');

            const bkSelect = document.getElementById('posBookSelect');
            bkSelect.innerHTML = inventoryBooks.map(b => `<option value="${b.id}">${b.service_name || b.title} - [${b.price} ج.م]</option>`).join('');

            if (preSelectedBookId) {
                bkSelect.value = preSelectedBookId;
            }

            document.getElementById('posModal').classList.remove('hidden');
        }

        function closePosModal() {
            document.getElementById('posModal').classList.add('hidden');
        }

        async function handleExecutePosSale(e) {
            e.preventDefault();
            const studentId = document.getElementById('posStudentSelect').value;
            const serviceId = document.getElementById('posBookSelect').value;
            const qty = parseInt(document.getElementById('posQuantityInput').value) || 1;

            try {
                const response = await fetch('/api/inventory/pos-sale', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-center-id': centerId },
                    body: JSON.stringify({ student_id: studentId, service_id: serviceId, quantity: qty })
                });

                const resData = await response.json();
                if (resData.success) {
                    closePosModal();
                    showToast('تم تنفيذ البيع وخصم المخزون بنجاح!');
                    fetchInventoryFromApi();
                } else {
                    showToast(resData.message || 'خطأ أثناء عملية البيع');
                }
            } catch (err) {
                showToast('تعذر الاتصال بالسيرفر');
            }
        }

        function openAddBookModal() {
            document.getElementById('addBookModal').classList.remove('hidden');
        }
        function closeAddBookModal() {
            document.getElementById('addBookModal').classList.add('hidden');
            document.getElementById('addBookForm').reset();
        }

        function handleCreateBook(e) {
            e.preventDefault();
            closeAddBookModal();
            showToast('تمت إضافة الملزمة بنجاح');
            fetchInventoryFromApi();
        }

        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
