<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full bg-slate-950 selection:bg-sky-500 selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة السناتر (Center SaaS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .bg-grid-pattern {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex items-center justify-center p-4 bg-grid-pattern">

    <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden space-y-6 backdrop-blur-md">
        
        <div class="text-center space-y-3">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-600 via-indigo-600 to-purple-600 p-0.5 shadow-xl shadow-sky-500/30 mx-auto">
                <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center text-sky-400 font-black text-2xl">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
            </div>
            <h2 class="text-2xl font-black text-white tracking-tight">Center Zone System</h2>
            <p class="text-xs text-slate-400">سجل دخولك للوصول إلى لوحة التحكم أو لوحة الإدارة</p>
        </div>

        <div id="loginAlert" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="loginAlertText">اسم المستخدم أو كلمة السر غير صحيحة</span>
        </div>

        <form id="authForm" onsubmit="executeLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5">اسم المستخدم (Username) *</label>
                <div class="relative">
                    <input type="text" id="username" required placeholder="أدخل اسم المستخدم أو البريد الإلكتروني"
                        class="w-full bg-slate-950 border border-slate-800 text-slate-100 rounded-xl pr-10 pl-4 py-3 text-xs focus:ring-2 focus:ring-sky-500 outline-none transition-all">
                    <i class="fa-solid fa-user absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5">كلمة السر (Password) *</label>
                <div class="relative">
                    <input type="password" id="password" required placeholder="••••••••"
                        class="w-full bg-slate-950 border border-slate-800 text-slate-100 rounded-xl pr-10 pl-4 py-3 text-xs focus:ring-2 focus:ring-sky-500 outline-none transition-all">
                    <i class="fa-solid fa-lock absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-sky-600 via-indigo-600 to-purple-600 hover:opacity-95 text-white font-bold rounded-xl text-xs shadow-lg shadow-indigo-500/25 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>تسجيل الدخول</span>
            </button>
        </form>
    </div>

    <script>
        async function executeLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('loginAlert');
            const alertText = document.getElementById('loginAlertText');

            alertBox.classList.add('hidden');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const resData = await response.json();

                if (response.ok && resData.success && resData.data) {
                    const { token, userRole, centerId } = resData.data;
                    localStorage.setItem('centerzone_token', token);
                    localStorage.setItem('userRole', userRole);
                    if (centerId) {
                        localStorage.setItem('x-center-id', centerId);
                        localStorage.setItem('centerId', centerId);
                    }
                    localStorage.setItem('username', username);
                    
                    const redirectUrl = sessionStorage.getItem('redirect_after_login');
                    if (redirectUrl) {
                        sessionStorage.removeItem('redirect_after_login');
                        window.location.href = redirectUrl;
                    } else if (userRole === 'SUPER_ADMIN') {
                        window.location.href = '/super-admin.html';
                    } else {
                        window.location.href = '/index.html';
                    }
                } else {
                    alertText.textContent = resData.message || 'اسم المستخدم أو كلمة السر غير صحيحة';
                    alertBox.classList.remove('hidden');
                }
            } catch (error) {
                alertText.textContent = 'خطأ في الاتصال بالسيرفر وقاعدة البيانات';
                alertBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
