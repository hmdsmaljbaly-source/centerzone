<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full bg-slate-950 selection:bg-sky-500 selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة السناتر التعليمية (Center SaaS)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cairo & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }

        /* Subtle Grid Pattern */
        .bg-grid-pattern {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased flex items-center justify-center p-4 bg-grid-pattern relative overflow-hidden">

    <!-- Background Ambient Glows -->
    <div class="absolute top-1/4 -right-20 w-96 h-96 bg-sky-600/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 -left-20 w-96 h-96 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Login Card Container -->
    <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative z-10 space-y-6 backdrop-blur-md">
        
        <!-- Header Branding -->
        <div class="text-center space-y-2">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-600 via-indigo-600 to-purple-600 p-0.5 mx-auto shadow-xl shadow-sky-500/20">
                <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center text-sky-400 font-black text-2xl">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
            </div>
            <h1 class="text-xl font-black text-white tracking-tight">نظام إدارة السناتر (Center SaaS)</h1>
            <p class="text-xs text-slate-400">سجل دخولك للوصول إلى لوحة تحكم السنتر أو لوحة الإدارة</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="loginAlert" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="loginAlertText">اسم المستخدم أو كلمة السر غير صحيحة</span>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5">اسم المستخدم (Username) *</label>
                <div class="relative">
                    <input type="text" id="inputUsername" required placeholder="مثال: admin أو center101" 
                        class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl pr-10 pl-3 py-2.5 text-xs focus:ring-2 focus:ring-sky-500 outline-none transition-all">
                    <i class="fa-solid fa-user absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5">كلمة السر (Password) *</label>
                <div class="relative">
                    <input type="password" id="inputPassword" required placeholder="••••••••" 
                        class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl pr-10 pl-10 py-2.5 text-xs focus:ring-2 focus:ring-sky-500 outline-none transition-all">
                    <i class="fa-solid fa-lock absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-xs">
                        <i id="eyeIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="loginSubmitBtn" class="w-full py-3 bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-sky-500/20 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>تسجيل الدخول</span>
            </button>
        </form>

        <!-- Demo Accounts Hint Helper Box -->
        <div class="p-3.5 bg-slate-950 border border-slate-800 rounded-2xl text-[11px] space-y-2">
            <p class="font-bold text-slate-300 flex items-center gap-1.5">
                <i class="fa-solid fa-lightbulb text-amber-400"></i>
                حسابات تجريبية للاختبار السريع (Demo Login):
            </p>
            <div class="grid grid-cols-2 gap-2 text-slate-400 font-mono">
                <button type="button" onclick="fillDemoCredentials('superadmin', 'admin123')" class="p-2 bg-slate-900 border border-slate-800 rounded-xl text-right hover:border-purple-500 transition-colors">
                    <span class="block text-purple-400 font-bold font-sans">🛡️ Super Admin</span>
                    <span>superadmin / admin123</span>
                </button>
                <button type="button" onclick="fillDemoCredentials('center101', 'center123')" class="p-2 bg-slate-900 border border-slate-800 rounded-xl text-right hover:border-sky-500 transition-colors">
                    <span class="block text-sky-400 font-bold font-sans">🏫 مدير سنتر</span>
                    <span>center101 / center123</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('inputPassword');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.className = 'fa-solid fa-eye-slash';
            } else {
                pwdInput.type = 'password';
                eyeIcon.className = 'fa-solid fa-eye';
            }
        }

        function fillDemoCredentials(username, password) {
            document.getElementById('inputUsername').value = username;
            document.getElementById('inputPassword').value = password;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('inputUsername').value.trim();
            const password = document.getElementById('inputPassword').value.trim();
            const alertBox = document.getElementById('loginAlert');
            const alertText = document.getElementById('loginAlertText');

            alertBox.classList.add('hidden');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const resData = await response.json();

                if (resData.success) {
                    // Save User Session Data
                    localStorage.setItem('currentUser', JSON.stringify(resData.data));
                    
                    if (resData.data.role === 'SUPER_ADMIN') {
                        window.location.href = 'super-admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    alertText.textContent = resData.message || 'بيانات الدخول غير صحيحة';
                    alertBox.classList.remove('hidden');
                }
            } catch (error) {
                // Client Fallback for Demo Testing
                if (username === 'superadmin' && password === 'admin123') {
                    localStorage.setItem('currentUser', JSON.stringify({ username: 'superadmin', role: 'SUPER_ADMIN' }));
                    window.location.href = 'super-admin.html';
                } else if (username === 'center101' && password === 'center123') {
                    localStorage.setItem('currentUser', JSON.stringify({ username: 'center101', role: 'CENTER_ADMIN', centerId: 'center-101' }));
                    window.location.href = 'index.html';
                } else {
                    alertText.textContent = 'خطأ في الاتصال بالسيرفر أو بيانات غير صحيحة';
                    alertBox.classList.remove('hidden');
                }
            }
        }
    </script>
</body>
</html>
