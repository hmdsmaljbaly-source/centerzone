<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة إدارة السنتر - لوحة التحكم</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts (Cairo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Cairo', sans-serif; }
        .bg-grid-pattern {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
    <!-- Auth Guard & Global Fetch Interceptor -->
    <script src="js/app-core.js"></script>
    <!-- Collapsible Sidebar Styles & Navigation Script -->
    <link rel="stylesheet" href="css/sidebar.css">
    <script src="js/sidebar-navigation.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased bg-grid-pattern flex">

    <div id="main-wrapper" class="flex-1 flex flex-col min-h-screen transition-all duration-300">
        <!-- Header / Navbar -->
        <header class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-50 backdrop-blur-md">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-600 to-indigo-600 flex items-center justify-center text-white text-lg font-black shadow-lg shadow-sky-500/20">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <div>
                        <h1 class="text-sm font-black text-white">منظومة إدارة السنتر</h1>
                        <span class="text-[11px] text-slate-400 block" id="currentCenterBadge">السنتر الحالي</span>
                    </div>
                </div>
    
                <button onclick="handleLogout()" class="px-3.5 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 rounded-xl text-xs font-bold transition-all flex items-center gap-2">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>تسجيل الخروج</span>
                </button>
            </div>
        </header>

    <!-- Main Dashboard Body -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- Stats Bar -->
        <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-slate-900/90 border border-slate-800/90 rounded-2xl p-4 flex items-center gap-4 relative overflow-hidden shadow-lg group">
                <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-user-check"></i>
                </div>
                <div>
                    <span class="text-xs text-slate-400 block font-medium">إجمالي الطلاب</span>
                    <div class="flex items-baseline gap-2">
                        <span id="kpiTotalStudents" class="text-2xl font-black text-white font-mono">0</span>
                    </div>
                </div>
            </div>

            <div class="bg-slate-900/90 border border-slate-800/90 rounded-2xl p-4 flex items-center gap-4 relative overflow-hidden shadow-lg group">
                <div class="w-12 h-12 rounded-2xl bg-sky-500/10 border border-sky-500/20 text-sky-400 flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-chalkboard-user"></i>
                </div>
                <div>
                    <span class="text-xs text-slate-400 block font-medium">مجموعات اليوم</span>
                    <div class="flex items-baseline gap-2">
                        <span id="kpiActiveGroups" class="text-2xl font-black text-white font-mono">0</span>
                    </div>
                </div>
            </div>

            <div class="bg-slate-900/90 border border-slate-800/90 rounded-2xl p-4 flex items-center gap-4 relative overflow-hidden shadow-lg group">
                <div class="w-12 h-12 rounded-2xl bg-purple-500/10 border border-purple-500/20 text-purple-400 flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-user-tie"></i>
                </div>
                <div>
                    <span class="text-xs text-slate-400 block font-medium">عدد المدرسين</span>
                    <div class="flex items-baseline gap-2">
                        <span id="kpiTeachersCount" class="text-2xl font-black text-purple-300 font-mono">0</span>
                    </div>
                </div>
            </div>

            <div class="bg-slate-900/90 border border-slate-800/90 rounded-2xl p-4 flex items-center gap-4 relative overflow-hidden shadow-lg group">
                <div class="w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <div>
                    <span class="text-xs text-slate-400 block font-medium">الملازم بالمخزن</span>
                    <div class="flex items-baseline gap-2">
                        <span id="kpiInventoryCount" class="text-2xl font-black text-amber-300 font-mono">0</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Today's Groups schedule section -->
        <section class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-sky-500/10 text-sky-400 flex items-center justify-center text-sm">
                        <i class="fa-solid fa-calendar-day"></i>
                    </div>
                    <h3 class="text-sm font-bold text-white">جدول مجموعات اليوم الدراسي الحالية</h3>
                </div>
            </div>
            <div id="todayGroupsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-xs text-slate-400 col-span-full text-center py-4">جاري تحميل جدول اليوم...</p>
            </div>
        </section>
    </main>

    </div><!-- End of #main-wrapper -->

    <script src="js/index.js"></script>
</body>
</html>
