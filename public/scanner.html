<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الحضور والغياب | CenterZone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <script src="js/app-core.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; }
        .kpi-card { transition: transform 0.2s; }
        .kpi-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200">
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Header Navigation -->
    <nav class="bg-indigo-700 text-white shadow-lg p-4 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold"><i class="fas fa-barcode ml-2"></i>تسجيل الحضور</h1>
            <a href="index.html" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded font-bold shadow">
                <i class="fas fa-home ml-2"></i>الرئيسية
            </a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6 space-y-6">
        
        <!-- Controls & Scanning Section -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 border-t-4 border-indigo-500 flex flex-col md:flex-row gap-6">
            <!-- Group Selection -->
            <div class="flex-1">
                <label class="block text-sm font-bold mb-2">اختر المجموعة الدراسية</label>
                <select id="groupSelect" class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-lg">
                    <option value="">جاري تحميل المجموعات...</option>
                </select>
            </div>
            
            <!-- Barcode Scanner -->
            <div class="flex-2 w-full md:w-1/2">
                <label class="block text-sm font-bold mb-2">امسح كود الطالب (Barcode)</label>
                <div class="relative shadow-sm rounded-lg">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fas fa-qrcode text-xl"></i>
                    </div>
                    <input type="text" id="barcodeInput" disabled autofocus placeholder="انتظر اختيار المجموعة..." class="block w-full pr-10 border-gray-300 p-4 text-xl rounded-lg focus:ring-indigo-500 focus:border-indigo-500" autocomplete="off">
                </div>
            </div>
        </div>

        <!-- Real-time KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="kpi-card bg-white dark:bg-gray-800 rounded-lg shadow p-6 border-r-4 border-indigo-500 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-bold mb-1">إجمالي الطلاب (بالمجموعة)</p>
                    <p id="kpiTotal" class="text-3xl font-bold text-gray-800 dark:text-white">0</p>
                </div>
                <div class="w-12 h-12 bg-indigo-100 text-indigo-500 rounded-full flex justify-center items-center text-2xl">
                    <i class="fas fa-users"></i>
                </div>
            </div>
            <div class="kpi-card bg-white dark:bg-gray-800 rounded-lg shadow p-6 border-r-4 border-emerald-500 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-bold mb-1">الحضور اليوم</p>
                    <p id="kpiPresent" class="text-3xl font-bold text-gray-800 dark:text-white">0</p>
                </div>
                <div class="w-12 h-12 bg-emerald-100 text-emerald-500 rounded-full flex justify-center items-center text-2xl">
                    <i class="fas fa-user-check"></i>
                </div>
            </div>
            <div class="kpi-card bg-white dark:bg-gray-800 rounded-lg shadow p-6 border-r-4 border-rose-500 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-bold mb-1">الغياب</p>
                    <p id="kpiAbsent" class="text-3xl font-bold text-gray-800 dark:text-white">0</p>
                </div>
                <div class="w-12 h-12 bg-rose-100 text-rose-500 rounded-full flex justify-center items-center text-2xl">
                    <i class="fas fa-user-times"></i>
                </div>
            </div>
        </div>

        <!-- Assessment Bar -->
        <div class="bg-indigo-50 dark:bg-gray-700 rounded-lg shadow p-4 flex flex-col md:flex-row items-center gap-4 border border-indigo-100">
            <h3 class="font-bold text-indigo-800 dark:text-indigo-200 whitespace-nowrap"><i class="fas fa-star text-amber-400 ml-2"></i>إضافة امتحان/تسميع</h3>
            <input type="text" id="assessTitle" placeholder="اسم الامتحان (مثال: كويز 1)" class="flex-1 p-2 rounded border focus:ring-2 outline-none">
            <input type="number" id="assessMax" placeholder="الدرجة النهائية" class="w-32 p-2 rounded border focus:ring-2 outline-none">
            <button onclick="createAssessment()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded shadow transition font-bold">بدء التقييم</button>
        </div>

        <!-- Students Live List -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200 text-right">
                <thead class="bg-gray-50 dark:bg-gray-700">
                    <tr>
                        <th class="px-6 py-3 font-bold text-gray-500">اسم الطالب</th>
                        <th class="px-6 py-3 font-bold text-gray-500">كود الطالب</th>
                        <th class="px-6 py-3 font-bold text-gray-500">الحالة</th>
                        <th class="px-6 py-3 font-bold text-gray-500">الرصيد المتبقي</th>
                        <th id="gradeColHeader" class="px-6 py-3 font-bold text-gray-500 hidden text-center">الدرجة</th>
                    </tr>
                </thead>
                <tbody id="studentList" class="divide-y divide-gray-100 bg-white dark:bg-gray-800">
                    <tr>
                        <td colspan="5" class="px-6 py-10 text-center text-gray-500 font-bold">برجاء اختيار مجموعة لعرض الطلاب</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
    
    <script src="js/scanner.js"></script>
</body>
</html>
